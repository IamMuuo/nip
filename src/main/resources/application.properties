spring.application.name=nip

# Actuator configuration
management.endpoints.web.base-path=/details
management.endpoints.web.exposure.include=health,info,metrics
management.endpoint.heapdump.enabled=false
management.endpoint.threaddump.enabled=false

management.info.env.enabled=true
info.name=Nip Application Backend
info.app.author=Erick Muuo
info.app.documentation=

management.info.build.enabled=true
management.info.git.enabled=true
management.info.java.enabled=true
management.info.os.enabled=true

# Postgres connection
spring.datasource.url=jdbc:postgresql://localhost:5432/nip
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}

spring.datasource.driver-class-name=org.postgresql.Driver


# Hibernate / JPA
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true

# Jackson Configuration
spring.jackson.property-naming-strategy=SNAKE_CASE

# Flyway
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.baseline-on-migrate=false
spring.flyway.validate-on-migrate=true
spring.flyway.baseline-version=1
